</script>
<style>
  :root {
    --bg: #070d18;
    --panel: rgba(13, 24, 42, .82);
    --line: rgba(34, 211, 238, .22);
    --line-strong: rgba(34, 211, 238, .55);
    --cyan: #22d3ee;
    --cyan-soft: #67e8f9;
    --txt: #c9d8e6;
    --txt-dim: #647d95;
    --mono: "Cascadia Code", Consolas, "JetBrains Mono", monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; height: 100dvh; }
  body {
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 90% 55% at 50% -10%, rgba(34,211,238,.10), transparent),
      linear-gradient(rgba(34,211,238,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(34,211,238,.03) 1px, transparent 1px);
    background-size: auto, 30px 30px, 30px 30px;
    color: var(--txt);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  /* ===== 顶栏 ===== */
  header {
    display: flex; align-items: center; gap: 10px;
    padding: calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 12px calc(16px + env(safe-area-inset-left));
    border-bottom: 1px solid var(--line);
    background: rgba(7, 13, 24, .85);
    backdrop-filter: blur(8px);
    flex-shrink: 0; flex-wrap: wrap;
  }
  .brand {
    display: flex; align-items: baseline; gap: 8px;
    margin-right: auto; user-select: none;
  }
  .brand b {
    font-size: 16px; letter-spacing: 1px;
    background: linear-gradient(90deg, #67e8f9 0%, #eafcff 50%, #67e8f9 100%);
    background-size: 200% auto;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 10px rgba(34,211,238,.4));
    animation: fxShimmer 6s linear infinite;
  }
  @keyframes fxShimmer { to { background-position: 200% center; } }
  .brand span { font-size: 11px; color: var(--txt-dim); letter-spacing: 2px; }
  .btn {
    appearance: none; border: 1px solid var(--line-strong);
    background: rgba(34,211,238,.06); color: var(--cyan-soft);
    font-size: 13px; padding: 7px 14px; border-radius: 8px;
    cursor: pointer; transition: all .15s; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { background: rgba(34,211,238,.14); box-shadow: 0 0 14px rgba(34,211,238,.25); }
  .btn.on { background: rgba(34,211,238,.18); color: #fff; box-shadow: 0 0 12px rgba(34,211,238,.25); }
  .btn.primary {
    background: linear-gradient(135deg, #0e7490, #06b6d4);
    border-color: transparent; color: #fff; font-weight: 600;
    box-shadow: 0 0 18px rgba(34,211,238,.35);
  }
  .btn.primary:hover { box-shadow: 0 0 26px rgba(34,211,238,.55); }
  select.btn { padding-right: 8px; }
  select.btn option { background: #0d1826; color: var(--txt); }

  /* ===== 主区 ===== */
  main { flex: 1; display: flex; min-height: 0; padding: 14px; gap: 14px; }
  .pane {
    position: relative; flex: 1; min-width: 0;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; overflow: hidden;
    backdrop-filter: blur(6px);
    display: flex; flex-direction: column;
  }
  .pane::before, .pane::after {
    content: ""; position: absolute; width: 16px; height: 16px;
    border-color: var(--cyan); border-style: solid; z-index: 5; pointer-events: none;
    filter: drop-shadow(0 0 4px rgba(34,211,238,.6));
  }
  .pane::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; border-radius: 14px 0 0 0; }
  .pane::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; border-radius: 0 0 14px 0; }
  .pane-label {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    font-size: 10px; letter-spacing: 3px; color: var(--txt-dim); z-index: 4;
    pointer-events: none;
  }
  #editor {
    flex: 1; width: 100%; resize: none; border: none; outline: none;
    background: transparent; color: #b8e6f2;
    font-family: var(--mono); font-size: 13.5px; line-height: 1.7;
    padding: 8px 18px 18px; caret-color: var(--cyan);
  }
  /* ===== MD 快捷工具栏（图标式） ===== */
  #mdBar {
    display: flex; align-items: center; gap: 5px;
    padding: 30px 12px 8px;
    overflow-x: auto; flex-shrink: 0; scrollbar-width: none;
  }
  #mdBar::-webkit-scrollbar { display: none; }
  .mbtn {
    appearance: none; border: 1px solid rgba(34,211,238,.13);
    background: rgba(34,211,238,.05); color: var(--txt-dim);
    width: 34px; height: 32px; padding: 0; border-radius: 8px;
    display: grid; place-items: center; cursor: pointer;
    font-size: 14px; font-family: var(--mono); line-height: 1;
    white-space: nowrap; transition: all .15s; flex: 0 0 auto;
  }
  .mbtn:hover {
    color: #fff; background: rgba(34,211,238,.16);
    border-color: var(--line-strong); box-shadow: 0 0 12px rgba(34,211,238,.18);
    transform: translateY(-1px);
  }
  .mbtn:active { transform: translateY(0); box-shadow: none; }
  .mbtn.h { font-weight: 800; font-size: 12px; letter-spacing: 0; }
  .mbtn.h .lv { font-size: 9px; color: var(--cyan-soft); margin-left: 1px; }
  .mbtn.strong { font-weight: 800; }
  .mbtn.italic { font-style: italic; font-family: Georgia, serif; }
  .mbtn.strike { text-decoration: line-through; }
  .mbtn.sep { width: 1px; height: 20px; padding: 0; margin: 0 4px; background: var(--line); pointer-events: none; }
  #previewScroll {
    flex: 1; overflow-y: auto; padding: 24px 20px 60px;
  }
  #preview {
    max-width: 640px; margin: 0 auto;
    background: #fff; border-radius: 10px;
    padding: 26px 22px 40px;
    min-height: 100%;
    box-shadow: 0 6px 30px rgba(0,0,0,.45);
  }

  /* ===== 底栏 ===== */
  footer {
    flex-shrink: 0; display: flex; align-items: center; gap: 16px;
    padding: 8px calc(18px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left)); border-top: 1px solid var(--line);
    font-size: 11.5px; color: var(--txt-dim); letter-spacing: 1px;
    background: rgba(7,13,24,.85); flex-wrap: wrap;
  }
  footer .dot { color: var(--cyan); }
  #fileName { color: var(--cyan-soft); }

  /* ===== 移动端 ===== */
  .mtabs { display: none; }
  @media (max-width: 860px) {
    main { padding: 10px; gap: 10px; }
    .pane { display: none; }
    body.mode-edit  #paneEdit   { display: flex; }
    body.mode-view  #paneView   { display: flex; }
    .mtabs {
      display: flex; gap: 8px; padding: 8px 14px 2px;
      flex-shrink: 0;
    }
    .mtabs .btn { flex: 1; justify-content: center; padding: 9px 0; }
    .mtabs .btn.on { background: rgba(34,211,238,.16); color: #fff; }
    header { padding: 10px 12px; gap: 8px; }
    .brand span { display: none; }
    .btn { font-size: 12px; padding: 7px 10px; }
  }

  /* ===== 氛围层：扫描线 + 星点 ===== */
  #fxAmbient { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  #fxAmbient::after {
    content: ""; position: absolute; left: 0; right: 0; height: 130px;
    background: linear-gradient(180deg, transparent, rgba(34,211,238,.055), transparent);
    animation: fxScan 8s linear infinite;
  }
  @keyframes fxScan { 0% { top: -130px; } 100% { top: 110%; } }
  .fx-star {
    position: absolute; width: 2px; height: 2px; border-radius: 50%;
    background: #bff3ff; animation: fxTwinkle 2.8s ease-in-out infinite;
  }
  @keyframes fxTwinkle { 0%,100% { opacity: .08; transform: scale(.8); } 50% { opacity: .85; transform: scale(1.15); } }
  header, main, footer, .mtabs { position: relative; z-index: 1; }

  /* ===== 入场动画 ===== */
  header { animation: fxDown .45s ease-out; }

/* ================= 代码高亮（内联 span，深/浅两套色板） ================= */
const HL_PALETTES = {
  dark:  { comment: '#64748b', string: '#86efac', kw: '#f472b6', num: '#facc15' },
  light: { comment: '#a89f8d', string: '#6f6a35', kw: '#8a5a22', num: '#1b365d' }
};
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function highlight(code, pal) {
  pal = pal || HL_PALETTES.dark;
  let s = esc(code);
  // 先按行内 token 染色（注释/字符串优先占位，避免被后续规则二次染色）
  const stash = [];
  const keep = h => { stash.push(h); return '\u0000' + (stash.length - 1) + '\u0000'; };
  s = s.replace(/(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|\b(const|let|var|function|return|if|else|for|while|class|new|import|from|export|async|await|try|catch|def|print|in|of|not|and|or|None|True|False|null|undefined|true|false|this)\b|(\b\d+(?:\.\d+)?\b)/g,
    (m, com, str, kw, num) => {
      const c = com ? pal.comment : str ? pal.string : kw ? pal.kw : pal.num;
      return keep('<span style="color:' + c + '">' + m + '</span>');
    });
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => stash[i]);
}

/* ================= 一键格式化（代码块/行内代码/链接地址受保护） ================= */
const PUNCT_MAP = { ',': '，', ';': '；', ':': '：', '!': '！', '?': '？' };
function fmtPlain(s, o) {
  if (!s) return s;
  if (o.clean) {
    s = s.replace(/[ \t]+$/gm, '');
    s = s.replace(/\n{3,}/g, '\n\n');
    s = s.replace(/([\u4e00-\u9fa5])[ \t]+([,.;:!?])/g, '$1$2');
  }
  if (o.space) {
    s = s.replace(/([\u4e00-\u9fa5])([A-Za-z0-9])/g, '$1 $2');
    s = s.replace(/([A-Za-z0-9])([\u4e00-\u9fa5])/g, '$1 $2');
  }
  if (o.punct) {
    s = s.replace(/([\u4e00-\u9fa5])\s*[,;:!?\)]\s*/g, (m, c, p) => c + (PUNCT_MAP[p] || (p === ')' ? '）' : p)));
    s = s.replace(/([\u4e00-\u9fa5])\.(?!\d)/g, '$1。');
    s = s.replace(/\(([^()]*[\u4e00-\u9fa5][^()]*)\)/g, '（$1）');
  }
  if (o.quote) s = s.replace(/"([^"\n]*[\u4e00-\u9fa5][^"\n]*)"/g, '「$1」');
  return s;
}
function formatMarkdown(md, opt) {
  // 奇数段为受保护片段：代码块/行内代码/链接
  const segs = md.split(/(```[\s\S]*?(?:```|$)|`[^`\n]*`|\[[^\]\n]*\]\([^)\n]*\))/g);
  for (let i = 0; i < segs.length; i += 2) segs[i] = fmtPlain(segs[i], opt);
  return segs.join('');
}

const KEY_TWEAKS = 'md_tweaks';
let tweaks = (() => { try { return JSON.parse(store.get(KEY_TWEAKS, '')) || {}; } catch (_) { return {}; } })();
function tweakRootCss() {
  let s = '';
  if (tweaks.fs) s += 'font-size:' + tweaks.fs + 'px;';
  if (tweaks.lh) s += 'line-height:' + tweaks.lh + ';';
  return s;
}
function tweakPCss() {
  let s = '';
  if (tweaks.fs) s += 'font-size:' + tweaks.fs + 'px;';
  if (tweaks.lh) s += 'line-height:' + tweaks.lh + ';';
  if (tweaks.ps) s += 'margin:0 0 ' + tweaks.ps + 'px;';
  return s;
}
function tweakPadCss(h) { return 'padding:' + (tweaks.pad || (h ? 20 : 26)) + 'px ' + (h ? 18 : 22) + 'px ' + (h ? 20 : 40) + 'px;'; }

function cleanHTML(html) {
  if (!window.DOMPurify) throw new Error('安全组件未加载');
  return DOMPurify.sanitize(html, {
    USE_PROFILES: { html: true },
    FORBID_TAGS: ['script', 'iframe', 'object', 'embed', 'form', 'link', 'meta', 'base'],
    ADD_ATTR: ['align']
  });
}

function updateStats() {
  const txt = editor.value.trim();
  const cjk = (txt.match(/[\u4e00-\u9fa5]/g) || []).length;
  const words = (txt.replace(/[\u4e00-\u9fa5]/g, ' ').match(/[a-zA-Z0-9_]+/g) || []).length;
  const total = cjk + words;
  const minutes = total ? Math.max(1, Math.round(total / 400)) : 0;
  $('#stat').textContent = total + ' 字 · 约 ' + minutes + ' 分钟';
}

function updateImageStatus() {
  const imgs = Array.from(preview.querySelectorAll('img'));
  const local = imgs.filter(img => /^(data:|blob:)/i.test(img.getAttribute('src') || '')).length;
  const external = imgs.length - local;
  $('#imageStatus').textContent = imgs.length ? `图片 ${imgs.length} 张 · 外链 ${external} · 本地 ${local}` : '';

function render() {
  clearTimeout(renderTimer);
  updateStats();
  if (matchMedia('(max-width:860px)').matches && document.body.classList.contains('mode-edit')) {
    previewDirty = true;
    return;
  }
  try {
    const t = THEMES[currentTheme] || THEMES.tech;
    preview.innerHTML = cleanHTML(marked.parse(editor.value));
    const map = { P: t.p, H1: t.h1, H2: t.h2, H3: t.h3, H4: t.h4, H5: t.h4 || t.h3, H6: t.h4 || t.h3,
      BLOCKQUOTE: t.blockquote, UL: t.ul, OL: t.ol, LI: t.li, TABLE: t.table, TH: t.th, TD: t.td,
      HR: t.hr, IMG: t.img, STRONG: t.strong, EM: t.em, DEL: t.del, A: t.a, FIGCAPTION: t.figcaption };
    preview.querySelectorAll('*').forEach(el => {
      let st = map[el.tagName];
      if (el.tagName === 'CODE') st = el.closest('pre') ? t.precode : t.code;
      if (el.tagName === 'P') st = (st || '') + tweakPCss();
      const align = (el.tagName === 'TH' || el.tagName === 'TD') && el.getAttribute('align');
      const existing = el.getAttribute('style') || '';
      if (st || existing || align) el.setAttribute('style', (st || '') + existing + (align ? ';text-align:' + align + ';' : ''));
      if (el.tagName === 'A') { el.target = '_blank'; el.rel = 'noopener noreferrer'; }
      if (el.tagName === 'IMG') { el.loading = 'lazy'; el.decoding = 'async'; }
    });
    preview.querySelectorAll('pre').forEach(pre => {
      pre.setAttribute('style', t.pre);
      const code = pre.querySelector('code');
      if (code) code.innerHTML = highlight(code.textContent, t.codeLight ? HL_PALETTES.light : HL_PALETTES.dark);
    });
    preview.setAttribute('style', t.root + (canvasOn && t.canvas ? t.canvas : '') + tweakRootCss() + tweakPadCss());
    previewDirty = false;
    updateImageStatus();
  } catch (err) {
    console.error(err);
    toast('❌ 渲染失败：' + err.message);
  }
}

function normalizeForWechat(root) {
  root.querySelectorAll('input[type="checkbox"]').forEach(input => {
    const span = document.createElement('span');
    span.textContent = input.checked ? '✅ ' : '⬜ ';
    input.replaceWith(span);

    details.querySelectorAll(':scope > summary').forEach(summary => {
      const p = document.createElement('p');
      p.setAttribute('style', 'font-weight:700;margin:0 0 8px;');
      p.innerHTML = summary.innerHTML;
      summary.replaceWith(p);
    });
    const section = document.createElement('section');
    section.setAttribute('style', details.getAttribute('style') || '');
    section.innerHTML = details.innerHTML;
    details.replaceWith(section);
  });
  root.querySelectorAll('img').forEach(img => { img.removeAttribute('loading'); img.removeAttribute('decoding'); });
  root.querySelectorAll('a').forEach(a => { a.removeAttribute('target'); a.removeAttribute('rel'); });

function getWechatHTML() {
  if (previewDirty) render();
  const t = THEMES[currentTheme] || THEMES.tech;
  const bgHex = (canvasOn && t.canvas) ? t.canvas.replace('background-color:', '').replace(/;/g, '').trim() : '';
  const bodyClone = preview.cloneNode(true);
  bodyClone.removeAttribute('style');
  normalizeForWechat(bodyClone);
  // 外链转脚注：公众号会剥外链，收集成文末附录；本公众号域名链接保留
  const footNotes = [];
  if (footOn) {
    bodyClone.querySelectorAll('a[href]').forEach(a => {
      const href = a.getAttribute('href') || '';
      if (/^https?:/i.test(href) && href.indexOf('mp.weixin.qq.com') === -1) {
        const n = footNotes.push(href);
        const span = document.createElement('span');
        span.setAttribute('style', 'color:inherit;');
        const sup = document.createElement('sup');
        sup.setAttribute('style', 'font-size:11px;color:#999999;');
        sup.textContent = '[' + n + ']';
        span.append(document.createTextNode(a.textContent), sup);
        a.replaceWith(span);
      }
    });
  }
  if (bgHex) {
    Array.prototype.forEach.call(bodyClone.children, el => {
      const st = el.getAttribute('style') || '';
      if (st.indexOf('background-color') === -1 && st.indexOf('background:') === -1) el.setAttribute('style', st + 'background-color:' + bgHex + ';');
      if (el.tagName === 'TABLE') el.querySelectorAll('td,th').forEach(cell => { if (!cell.getAttribute('bgcolor')) cell.setAttribute('bgcolor', bgHex); });
    });
  }
  if (footNotes.length) {
    const sec = document.createElement('section');
    sec.setAttribute('style', 'margin-top:28px;padding-top:12px;border-top:1px solid #cccccc;font-size:12px;line-height:1.7;color:#888888;');
    footNotes.forEach((u, idx) => {
      const p = document.createElement('p');
      p.setAttribute('style', 'margin:4px 0;word-break:break-all;');
      p.textContent = '[' + (idx + 1) + '] ' + u;
      sec.appendChild(p);
    });
    bodyClone.appendChild(sec);
  }
  const plain = bodyClone.innerText;
  const inner = '<section style="' + t.root + (canvasOn && t.canvas ? t.canvas : '') + tweakRootCss() + tweakPadCss(true) + '">' + bodyClone.innerHTML + '</section>';
  const html = '<section style="width:100%;max-width:100%;box-sizing:border-box;background-color:' + (bgHex || '#ffffff') + ';">' + inner + '</section>';
  return { html: cleanHTML(html), plain: plain };
}

async function copyWechat() {
  const localImages = preview.querySelectorAll('img[src^="data:"],img[src^="blob:"]').length;
  if (localImages && !confirm('检测到 ' + localImages + ' 张本地图片。公众号通常不能直接使用本地图片，建议先替换为素材地址。仍继续复制吗？')) return;
  const w = getWechatHTML(), html = w.html, plain = w.plain;
  try {
    if (!(navigator.clipboard && window.ClipboardItem)) throw new Error('no api');
    await navigator.clipboard.write([new ClipboardItem({
      'text/html': new Blob([html], { type: 'text/html' }),
      'text/plain': new Blob([plain], { type: 'text/plain' })
    })]);
    toast('✅ 已复制，去公众号后台粘贴'); flashCopy();
  } catch (_) {
    const holder = document.createElement('div');
    holder.contentEditable = 'true';
    holder.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
    holder.innerHTML = html;
    document.body.appendChild(holder);
    const sel = getSelection(), saved = [];
    for (let i = 0; i < sel.rangeCount; i++) saved.push(sel.getRangeAt(i).cloneRange());
    const range = document.createRange(); range.selectNodeContents(holder);
    sel.removeAllRanges(); sel.addRange(range);
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (_) {}
    sel.removeAllRanges(); saved.forEach(r => sel.addRange(r)); holder.remove();
    if (ok) { toast('✅ 已复制（兼容模式）'); flashCopy(); }
    else showFallback(html);
  }
}

function safeBaseName() {

}
function downloadBlob(content, type, name) {
  const a = document.createElement('a'), url = URL.createObjectURL(new Blob([content], { type }));
  a.href = url; a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);

function getHistory() {
  try { const list = JSON.parse(store.get(KEY_HISTORY, '[]')); return Array.isArray(list) ? list : []; }
  catch (_) { return []; }
}
function snapshotCurrent() {
  if (!editor.value.trim()) return;
  const list = getHistory();
  if (list[0] && list[0].content === editor.value) return;
  list.unshift({ id: Date.now().toString(36), name: $('#fileName').textContent || '未命名.md', content: editor.value, theme: currentTheme, canvas: canvasOn, savedAt: Date.now() });
  store.set(KEY_HISTORY, JSON.stringify(list.slice(0, 8)));
  renderHistory();
}
function renderHistory() {
  const host = $('#historyList'); host.textContent = '';
  const list = getHistory();
  if (!list.length) { const p = document.createElement('p'); p.className = 'modal-note'; p.textContent = '还没有历史版本。'; host.appendChild(p); return; }
  list.forEach(item => {
    const row = document.createElement('div'); row.className = 'history-item';
    const meta = document.createElement('div'); meta.className = 'history-meta';
    const name = document.createElement('b'); name.textContent = item.name || '未命名.md';
    const time = document.createElement('time'); time.textContent = new Date(item.savedAt).toLocaleString('zh-CN');
    meta.append(name, time);
    const restore = document.createElement('button'); restore.className = 'btn'; restore.textContent = '恢复';
    restore.addEventListener('click', () => {
      if (!prepareReplace()) return;
      editor.value = item.content; $('#fileName').textContent = item.name || '已恢复文稿.md';
      currentTheme = THEMES[item.theme] ? item.theme : currentTheme; canvasOn = item.canvas !== false;
      $('#themeSel').value = currentTheme; syncCanvasBtn(); saveDraft(true); render(); closeModals(); toast('✅ 已恢复所选版本');
    });
    row.append(meta, restore); host.appendChild(row);
  });
}
function prepareReplace() {
  if (!editor.value.trim()) return true;
  if (!confirm('当前文稿将被替换。系统会先保存一个历史版本，是否继续？')) return false;
  snapshotCurrent(); return true;
}
function setDocument(content, name) {
  editor.value = content; $('#fileName').textContent = name;
  store.set(KEY_NAME, name); saveDraft(true); render();
}
async function openFile(file) {
  if (!file) return;
  if (file.type.startsWith('image/')) return insertLocalImage(file);
  if (!/\.(md|markdown|txt)$/i.test(file.name) && file.type && !file.type.startsWith('text/')) { toast('❌ 仅支持 MD、Markdown 或文本文件'); return; }
  if (file.size > 3 * 1024 * 1024) { toast('❌ 文件超过 3MB，请先拆分或清理'); return; }
  try {
    const buffer = await file.arrayBuffer(); let text;
    try { text = new TextDecoder('utf-8', { fatal: true }).decode(buffer); }
    catch (_) { text = new TextDecoder('gb18030').decode(buffer); }
    if (!prepareReplace()) return;
    setDocument(text.replace(/^\ufeff/, ''), file.name);
    if (document.body.classList.contains('mode-edit')) toggleMode('view');
    toast('📂 已打开 ' + file.name);
  } catch (_) { toast('❌ 文件读取失败，请确认文件未损坏'); }
}
function insertLocalImage(file) {
  if (!file || !file.type.startsWith('image/')) return;
  if (file.size > 2 * 1024 * 1024) { toast('❌ 本地图片不能超过 2MB'); return; }
  const rd = new FileReader();
  rd.onload = () => {
    const alt = (file.name || '本地图片').replace(/[\[\]\n]/g, '');
    insertText('![' + alt + '](' + rd.result + ')');
    toast('⚠️ 本地图片仅供预览，复制前请替换为公众号素材地址');
  };
  rd.onerror = () => toast('❌ 图片读取失败');
  rd.readAsDataURL(file);
}

/* ================= MD 快捷插入 ================= */
function insertText(text, selStart, selEnd) {
  const el = editor;
  const s = el.selectionStart, e = el.selectionEnd;
  el.focus();
  el.setSelectionRange(s, e);
  let ok = false;
  try { ok = document.execCommand('insertText', false, text); } catch (_) {}
  if (!ok) el.setRangeText(text, s, e, 'end');
  if (selStart != null) el.setSelectionRange(s + selStart, s + (selEnd != null ? selEnd : selStart));
  scheduleRender(); saveDraft();
}
// 包裹式：**选中** / 行内代码等，无选中时插入占位并选中
const wrap = (b, a, ph) => {
  const s = editor.selectionStart, e = editor.selectionEnd;
  const sel = editor.value.slice(s, e);
  const body = sel || ph;
  insertText(b + body + a, b.length, b.length + body.length);
};
// 行前缀式：标题/引用/列表，多行逐行加前缀
const linePrefix = (p, ph) => {
  const s = editor.selectionStart, e = editor.selectionEnd;
  const sel = editor.value.slice(s, e);
  const body = sel || ph;
  const out = body.split('\n').map(l => l.startsWith(p) ? l : p + l).join('\n');
  insertText(out, p.length, p.length + body.length);
};
// 块级模板：代码块/表格/折叠块等
const blockTpl = (txt, curOff) => insertText(txt, curOff != null ? curOff : txt.length, null);

const ACTIONS = {
  h1: () => linePrefix('# ', '标题'),
  h2: () => linePrefix('## ', '标题'),
  h3: () => linePrefix('### ', '小标题'),
  b:  () => wrap('**', '**', '加粗文字'),
  i:  () => wrap('*', '*', '斜体文字'),
  s:  () => wrap('~~', '~~', '删除文字'),
  code: () => wrap('`', '`', '代码'),
  quote: () => linePrefix('> ', '引用内容'),
  ul: () => linePrefix('- ', '列表项'),
  ol: () => linePrefix('1. ', '列表项'),
  task: () => linePrefix('- [ ] ', '待办事项'),
  codeblock: () => blockTpl('\n```js\n\n```\n', 7),
  table: () => blockTpl('\n| 列一 | 列二 | 列三 |\n| --- | --- | --- |\n| 内容 | 内容 | 内容 |\n\n'),
  hr: () => blockTpl('\n---\n\n'),
  link: () => wrap('[', '](https://)', '链接文字'),
  img: () => blockTpl('![](图片URL)'),
  details: () => blockTpl('\n<details>\n<summary>点击展开</summary>\n\n折叠的内容\n\n</details>\n')
};

  btnDark.classList.toggle('on', darkOn);
  document.body.classList.toggle('darkprev', darkOn);
  btnDark.setAttribute('aria-pressed', darkOn ? 'true' : 'false');
};
syncDarkBtn();
btnDark.addEventListener('click', () => {
  darkOn = !darkOn; store.set(KEY_DARK, darkOn ? '1' : '0'); syncDarkBtn();
  if (darkOn) toast('🌙 近似模拟微信深色模式，实际以真机为准');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModals();
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); snapshotCurrent(); toast('✅ 已保存到版本记录'); }
});

/* ================= 示例文档 ================= */
